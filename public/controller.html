<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mentis Drone Controller</title>
    <link rel="stylesheet" href="/controller.css?v=4" />
  </head>
  <body>
    <div id="app">
      <!-- Portrait rotate hint (non-blocking, controls stay usable) -->
      <div id="rotateOverlay" class="rotateBanner">
        <span class="rotateMsg">&#x27F3; Rotate to landscape for best controls</span>
        <button id="landscapeBtn" class="landscapeBtn">FORCE LANDSCAPE</button>
      </div>

      <header>
        <div class="title">
          <span class="dot" id="statusDot"></span>
          MENTIS DRONE
        </div>
        <div id="status" class="status off">OFFLINE</div>
      </header>
      <div id="debug" class="debug"></div>

      <div id="pair" class="pair">
        <p class="hint">Enter the 4-digit code shown on the computer screen</p>
        <input id="code" type="number" maxlength="4" inputmode="numeric" placeholder="0000" />
        <button id="pairBtn">CONNECT</button>
        <p id="pairError" class="err"></p>
      </div>

      <div id="controls" class="controls hidden">
        <div class="zone" id="leftZone">
          <div class="joybase"><div class="joyknob" id="leftKnob"></div></div>
          <span class="zoneLabel">THROTTLE / YAW</span>
        </div>
        <div class="zone" id="rightZone">
          <div class="joybase"><div class="joyknob" id="rightKnob"></div></div>
          <span class="zoneLabel">PITCH / ROLL</span>
        </div>
      </div>

      <div id="actionBar" class="actionBar hidden">
        <div class="actionRow">
          <button class="abtn takeoff" id="takeoffBtn">TAKEOFF</button>
          <button class="abtn land" id="landBtn">LAND</button>
          <button class="abtn reset" id="resetBtn">RESET</button>
          <button class="abtn mode" id="modeBtn">MODE</button>
          <button class="abtn cam" id="cameraBtn">CAM</button>
        </div>
        <div class="actionRow" id="secondRow">
          <button class="abtn turbo" id="turboBtn">TURBO</button>
          <span class="turboHint">Hold TURBO while tilting for speed boost</span>
        </div>
      </div>
    </div>

    <script src="/controller.js?v=4"></script>
  </body>
</html>
