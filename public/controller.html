<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Mentis Academy Remote</title>
    <link rel="stylesheet" href="/controller.css?v=7" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title">
          <span class="dot" id="statusDot"></span>
          MENTIS REMOTE
        </div>
        <div id="status" class="status off">OFFLINE</div>
      </header>
      <div id="debug" class="debug"></div>

      <div id="pair" class="pair">
        <p class="hint">Enter the 4-digit code shown on the computer screen</p>
        <input id="code" type="number" maxlength="4" inputmode="numeric" placeholder="0000" />
        <button id="pairBtn">CONNECT</button>
        <p id="pairError" class="err"></p>
      </div>

      <div id="controls" class="controls hidden">
        <!-- Mode switch: which app is on the big screen -->
        <div id="modes" class="modes">
          <button class="mode active" data-mode="chem">CHEM LAB</button>
          <button class="mode" data-mode="solar">SOLAR</button>
        </div>

        <!-- CHEMISTRY LAB: twin joysticks + action buttons -->
        <div id="chemLayout" class="layout">
          <div class="stickRow">
            <div class="stick" id="stickL">
              <span class="stickLabel">WALK</span>
              <div class="knob"></div>
            </div>
            <div class="stick" id="stickR">
              <span class="stickLabel">LOOK</span>
              <div class="knob"></div>
            </div>
          </div>
          <div class="btnGrid">
            <button class="abtn" data-key="Digit1">GLASS</button>
            <button class="abtn" data-key="Digit2">CHEMS</button>
            <button class="abtn" data-key="Digit3">TOOLS</button>
            <button class="abtn" data-key="KeyP">POUR</button>
            <button class="abtn" data-key="KeyF">HEAT</button>
            <button class="abtn" data-key="KeyC">CLEAR</button>
            <button class="abtn" data-key="KeyN">NOVA</button>
            <button class="abtn voice" id="voiceBtnChem">🎤 TALK</button>
          </div>
        </div>

        <!-- SOLAR ACADEMY: rotate pad + actions -->
        <div id="solarLayout" class="layout hidden">
          <div class="zone" id="touchZone">
            <span class="zoneLabel">DRAG TO ROTATE · TAP TO SELECT</span>
          </div>
          <div class="actionRow">
            <button class="abtn cam" id="cameraBtn">CAMERA</button>
            <button class="abtn reset" id="resetBtn">RESET</button>
            <button class="abtn voice" id="voiceBtn">🎤 TALK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/controller.js?v=7"></script>
  </body>
</html>
