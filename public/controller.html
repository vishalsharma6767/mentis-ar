<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#020617" />
    <title>Mentis Academy Remote</title>
    <link rel="stylesheet" href="/controller.css?v=9" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title">
          <span class="dot" id="statusDot"></span>
          MENTIS REMOTE
        </div>
        <div class="headerRight">
          <button id="fsBtn" class="fsBtn" title="Fullscreen">⛶</button>
          <div id="status" class="status off">OFFLINE</div>
        </div>
      </header>
      <div id="debug" class="debug"></div>

      <div id="pair" class="pair">
        <p class="hint">Enter the 4-digit code shown on the computer screen</p>
        <input id="code" type="number" maxlength="4" inputmode="numeric" placeholder="0000" />
        <button id="pairBtn">CONNECT</button>
        <p id="pairError" class="err"></p>
        <p class="pairHint">Rotate your phone sideways for landscape — tap ⛶ for fullscreen.</p>
      </div>

      <div id="controls" class="controls hidden">
        <!-- Mode switch: which app is on the big screen -->
        <div id="modes" class="modes">
          <button class="mode active" data-mode="chem">CHEM LAB</button>
          <button class="mode" data-mode="solar">SOLAR</button>
        </div>

        <!-- CHEMISTRY LAB: twin joysticks + numbers + action buttons -->
        <div id="chemLayout" class="layout">
          <div class="stickRow">
            <div class="stick" id="stickL">
              <span class="stickLabel">WALK</span>
              <div class="knob"></div>
            </div>
            <div class="stick" id="stickR">
              <span class="stickLabel">LOOK</span>
              <div class="knob"></div>
            </div>
          </div>
          <div class="ctrlGrid">
            <!-- Rack openers (1/2/3) AND item picker when the rack menu is open (1-9) -->
            <div class="numRow">
              <button class="abtn num" data-key="Digit1">1 GLASS</button>
              <button class="abtn num" data-key="Digit2">2 CHEMS</button>
              <button class="abtn num" data-key="Digit3">3 TOOLS</button>
              <button class="abtn num" data-key="Digit4">4</button>
              <button class="abtn num" data-key="Digit5">5</button>
              <button class="abtn num" data-key="Digit6">6</button>
              <button class="abtn num" data-key="Digit7">7</button>
              <button class="abtn num" data-key="Digit8">8</button>
              <button class="abtn num" data-key="Digit9">9</button>
            </div>
            <!-- Item navigation + lab actions -->
            <div class="actionRow2">
              <button class="abtn" data-key="KeyQ">◀</button>
              <button class="abtn" data-key="KeyE">▶</button>
              <button class="abtn" data-key="KeyX">REMOVE</button>
              <button class="abtn" data-key="Escape">ESC</button>
              <button class="abtn" data-key="KeyP">POUR</button>
              <button class="abtn" data-key="KeyM">MIX</button>
              <button class="abtn" data-key="KeyF">HEAT</button>
              <button class="abtn" data-key="KeyC">CLEAR</button>
              <button class="abtn" data-key="KeyN">NOVA</button>
              <button class="abtn voice" id="voiceBtnChem">🎤 TALK</button>
              <button class="abtn exit" id="exitBtn">⏏ EXIT</button>
            </div>
          </div>
        </div>

        <!-- SOLAR ACADEMY: rotate pad + actions -->
        <div id="solarLayout" class="layout hidden">
          <div class="zone" id="touchZone">
            <span class="zoneLabel">DRAG TO ROTATE · TAP TO SELECT</span>
          </div>
          <div class="actionRow">
            <button class="abtn cam" id="cameraBtn">CAMERA</button>
            <button class="abtn reset" id="resetBtn">RESET</button>
            <button class="abtn voice" id="voiceBtn">🎤 TALK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/controller.js?v=9"></script>
  </body>
</html>
